name: Validate desktop on Linux and Windows

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: desktop-validate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    linux:
        name: Linux build, tests, and gym
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install display server and Electron libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libnss3 libgtk-3-0 libgbm1 libasound2t64

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck desktop source
              run: |
                  pnpm --dir packages/happy-desktop-electron typecheck
                  pnpm --dir packages/happy-desktop-app typecheck
                  pnpm --dir packages/happy-desktop-gym typecheck

            - name: Test application
              run: pnpm test

            - name: Install the latest released Happy Agent
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="$(gh release view --repo slopus/happy-agent --json tagName --jq .tagName)"
                  VERSION="${TAG#v}"
                  mkdir -p "$RUNNER_TEMP/happy-agent"
                  gh release download "$TAG" --repo slopus/happy-agent \
                    --pattern "happy-agent-${VERSION}-linux-x64.tar.gz" \
                    --dir "$RUNNER_TEMP/happy-agent"
                  tar -xzf "$RUNNER_TEMP/happy-agent/happy-agent-${VERSION}-linux-x64.tar.gz" \
                    -C "$RUNNER_TEMP/happy-agent"
                  chmod +x "$RUNNER_TEMP/happy-agent/happy-agent-linux-x64"
                  printf 'HAPPY_DESKTOP_AGENT_EXECUTABLE=%s\n' \
                    "$RUNNER_TEMP/happy-agent/happy-agent-linux-x64" >> "$GITHUB_ENV"

            - name: Build the optimized desktop profile
              run: pnpm --dir packages/happy-desktop-electron build:profile:optimized

            - name: Run the Electron gym boot workload
              env:
                  ELECTRON_DISABLE_SANDBOX: "1"
              run: |
                  xvfb-run --auto-servernum \
                    pnpm --dir packages/happy-desktop-gym gym:electron run \
                    --profile smoke --workload boot

            - name: Upload gym artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-gym-linux
                  path: /tmp/hdg/*/artifacts/*
                  if-no-files-found: ignore

            - name: Package unsigned Linux builds
              run: pnpm --dir packages/happy-desktop-electron dist:linux

            - name: Upload Linux packages
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-linux-unsigned
                  path: packages/happy-desktop-electron/release/*.AppImage
                  if-no-files-found: error

    windows:
        name: Windows build, tests, and launch smoke
        runs-on: windows-latest
        timeout-minutes: 60
        defaults:
            run:
                shell: bash

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Run package scripts through Git Bash
              # The repository's package scripts use POSIX environment
              # assignments and utilities; cmd.exe cannot run them.
              run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck desktop source
              run: |
                  pnpm --dir packages/happy-desktop-electron typecheck
                  pnpm --dir packages/happy-desktop-app typecheck
                  pnpm --dir packages/happy-desktop-gym typecheck

            - name: Test application
              run: pnpm test

            - name: Build the optimized desktop profile
              run: pnpm --dir packages/happy-desktop-electron build:profile:optimized

            - name: Launch the desktop shell smoke
              run: pnpm --dir packages/happy-desktop-gym gym:electron smoke

            - name: Package unsigned Windows build
              run: pnpm --dir packages/happy-desktop-electron dist:win

            - name: Upload Windows package
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-windows-unsigned
                  path: packages/happy-desktop-electron/release/*.exe
                  if-no-files-found: error
