[package]
name = "happy-desktop-rust"
version = "0.7.0"
edition = "2024"
description = "Native GPUI rewrite of Happy for macOS"
license = "MIT"
publish = false

[dependencies]
getrandom = "0.3.4"
gpui = "=0.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.release]
lto = "thin"
strip = "symbols"
