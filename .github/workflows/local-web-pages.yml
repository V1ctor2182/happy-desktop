name: Deploy local web renderer

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    id-token: write
    pages: write

concurrency:
    group: local-web-pages
    cancel-in-progress: true

jobs:
    build:
        name: Build local web renderer
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Configure GitHub Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Build local web renderer
              env:
                  HAPPY_LOCAL_WEB_BUILD_ID: ${{ github.sha }}
              run: pnpm desktop:local:web

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: packages/happy-desktop-electron/release/local-web-site

    deploy:
        name: Deploy local web renderer
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0