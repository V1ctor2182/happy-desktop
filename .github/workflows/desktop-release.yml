name: Release macOS desktop

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

concurrency:
    group: desktop-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build macOS ${{ matrix.arch }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-14
                    - arch: x64
                      runner: macos-15-intel
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        env:
            APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
            APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
            CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Verify release identity
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  ROOT_VERSION="$(node -p "require('./package.json').version")"
                  DESKTOP_VERSION="$(node -p "require('./packages/happy2-desktop/package.json').version")"
                  printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
                  test "$RELEASE_TAG" = "v$ROOT_VERSION"
                  test "$DESKTOP_VERSION" = "$ROOT_VERSION"
                  test -n "$CSC_LINK"
                  test -n "$CSC_KEY_PASSWORD"
                  test -n "$APPLE_NOTARY_KEY_P8_BASE64"
                  test -n "$APPLE_API_KEY_ID"
                  test -n "$APPLE_API_ISSUER"
                  test -n "$APPLE_TEAM_ID"
                  test "$APPLE_TEAM_ID" = "466DQWDR8C"

            - name: Prepare App Store Connect API key
              run: |
                  NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY"
                  chmod 600 "$NOTARY_KEY"
                  printf 'APPLE_API_KEY=%s\n' "$NOTARY_KEY" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck desktop source
              if: matrix.arch == 'arm64'
              run: |
                  pnpm --dir packages/happy2-desktop typecheck
                  pnpm --dir packages/happy2-app typecheck

            - name: Build, sign, notarize, and verify both desktop distributions
              run: pnpm desktop:mac:release -- --arch ${{ matrix.arch }} --flavor all

            - name: Remove App Store Connect API key
              if: always()
              run: rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

            - name: Upload architecture artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy2-macos-${{ matrix.arch }}
                  path: |
                      packages/happy2-desktop/release/standard/*.dmg
                      packages/happy2-desktop/release/standard/*.zip
                      packages/happy2-desktop/release/standard/*.blockmap
                      packages/happy2-desktop/release/local-web/*.dmg
                      packages/happy2-desktop/release/local-web/*.zip
                      packages/happy2-desktop/release/local-web/*.blockmap
                  if-no-files-found: error

            - name: Build hosted local renderer
              if: matrix.arch == 'arm64'
              run: pnpm desktop:local:web

            - name: Upload hosted local renderer
              if: matrix.arch == 'arm64'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy2-local-web-site
                  path: packages/happy2-desktop/release/local-web-site
                  if-no-files-found: error

    release:
        name: Publish GitHub Release
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Download signed artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: happy2-macos-*
                  path: packages/happy2-desktop/release
                  merge-multiple: true

            - name: Create architecture-aware updater manifest
              env:
                  RELEASE_VERSION: ${{ github.ref_name }}
              run: |
                  RELEASE_VERSION="${RELEASE_VERSION#v}" \
                    node scripts/create-mac-update-manifest.mjs \
                    packages/happy2-desktop/release/standard
                  RELEASE_VERSION="${RELEASE_VERSION#v}" \
                    RELEASE_CHANNEL="local" \
                    node scripts/create-mac-update-manifest.mjs \
                    packages/happy2-desktop/release/local-web

            - name: Publish release assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    gh release upload "$RELEASE_TAG" \
                      packages/happy2-desktop/release/standard/*.dmg \
                      packages/happy2-desktop/release/standard/*.zip \
                      packages/happy2-desktop/release/standard/*.blockmap \
                      packages/happy2-desktop/release/standard/latest-mac.yml \
                      packages/happy2-desktop/release/local-web/*.dmg \
                      packages/happy2-desktop/release/local-web/*.zip \
                      packages/happy2-desktop/release/local-web/*.blockmap \
                      packages/happy2-desktop/release/local-web/local-mac.yml \
                      --clobber
                  else
                    gh release create "$RELEASE_TAG" \
                      packages/happy2-desktop/release/standard/*.dmg \
                      packages/happy2-desktop/release/standard/*.zip \
                      packages/happy2-desktop/release/standard/*.blockmap \
                      packages/happy2-desktop/release/standard/latest-mac.yml \
                      packages/happy2-desktop/release/local-web/*.dmg \
                      packages/happy2-desktop/release/local-web/*.zip \
                      packages/happy2-desktop/release/local-web/*.blockmap \
                      packages/happy2-desktop/release/local-web/local-mac.yml \
                      --generate-notes \
                      --title "Happy 2 $RELEASE_TAG"
                  fi
