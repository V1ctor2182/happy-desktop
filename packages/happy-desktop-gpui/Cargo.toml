[package]
name = "happy-desktop-gpui"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native GPUI macOS client for Happy Agent"

[[bin]]
name = "happy-gpui"
path = "src/main.rs"

[dependencies]
async-channel = "2.5"
flate2 = "1"
libc = "0.2"
objc2-app-kit = { version = "0.3", features = ["NSAccessibility", "NSWorkspace"] }
regex = "1"
sha2 = "0.10"
tar = "0.4"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "test-support"] }
